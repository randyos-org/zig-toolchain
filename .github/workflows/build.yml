name: Build

# Builds the Zig that zig-build pins (https://github.com/randyos-org/zig-build,
# the mirror of https://codeberg.org/emanspeaks/zig-build)
# natively on each GitHub-hosted runner in targets.json, with zig-build's own
# scripts: build-stage3.sh bootstraps from the upstream devkit for that host.
# Each build is packaged as a Zig install (bin/ and lib/zig: package.sh) and
# smoke-tested from the package on its runner (smoke.sh), and every host's
# build of one version goes into one release, `zig-<version>`, which
# setup/action.yml installs. A host whose own bootstrap fails (`cross_from` in
# targets.json) is cross-built by another host's stage3 of the same version, and
# smoke-tested on its own runner. All build logic lives in zig-build; this
# workflow only schedules it, packages and publishes.
#
# A host builds only when no recent release holds its key (cross-manifest.sh's
# host key: the zig-src pin, the devkit, the host triple and CPU, and the stage
# scripts), so unchanged inputs never rebuild.
#
# Jobs:
#   prepare  resolve the zig-build commit; the hosts whose key is unreleased
#   build    stage3 on each such host's own runner, package, smoke test; and
#            the cross-built host it serves, if any
#   smoke    the cross-built hosts' packages, on their own runners
#   publish  the archives and their manifests as release zig-<version>

on:
  # a push builds what its commit changes (unchanged keys skip), and shows as
  # the commit's check
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      zig_build_ref:
        description: zig-build branch, tag or commit to build from
        type: string
        default: main
      force:
        description: Build every host even if its key is already released
        type: boolean
        default: false
  # daily, for new zig-build commits (unchanged keys skip)
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  # the GitHub mirror of https://codeberg.org/emanspeaks/zig-build, its source
  ZIG_BUILD_URL: https://github.com/randyos-org/zig-build.git
  # zig-build's ci-sources.sh fetches zig-src (and upstream's release tags) from
  # here: the GitHub mirror of https://codeberg.org/emanspeaks/zig
  ZIG_SRC_URL: https://github.com/randyos-org/zig.git
  # the builds move between machines, so they must run on any CPU of their arch
  ZIG_HOST_CPU: baseline
  STAGE3_TESTS: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      zig_build_commit: ${{ steps.hosts.outputs.zig_build_commit }}
      hosts: ${{ steps.hosts.outputs.hosts }}
      cross: ${{ steps.hosts.outputs.cross }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out zig-build
        run: bash .github/scripts/clone-zig-build.sh "${{ inputs.zig_build_ref || 'main' }}"

      - name: Work out the hosts to build
        id: hosts
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          echo "zig_build_commit=$(git -C zig-build rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # the host keys the latest releases hold, one per host's manifest
          released=$(
            for tag in $(gh release list -R "$GITHUB_REPOSITORY" -L 10 --json tagName -q '.[].tagName | select(startswith("zig-"))'); do
              gh release download "$tag" -R "$GITHUB_REPOSITORY" -p 'manifest-*.json' -D "manifests/$tag" >/dev/null 2>&1 || true
            done
            # (none before the first release)
            cat manifests/*/*.json 2>/dev/null | jq -r '.host_key // empty' | sort -u || true
          )
          # every host's key and whether it needs building
          declare -A row key want
          targets=()
          while IFS= read -r r; do
            t=$(jq -r .target <<< "$r")
            skip=$(jq -r '.skip // empty' <<< "$r")
            if [ -n "$skip" ]; then
              echo "::notice::$t: skipped ($skip)"
              continue
            fi
            k=$(cd zig-build && ZIG_HOST_TARGET=$t bash ./cross-manifest.sh key host)
            [ -n "$k" ] || { echo "::error::empty host key for $t"; exit 1; }
            row[$t]=$r
            key[$t]=$k
            targets+=("$t")
            if [ "$FORCE" != true ] && grep -qx "$k" <<< "$released"; then
              want[$t]=false
              echo "$t: $k is released"
            else
              want[$t]=true
              echo "$t: building ($k)"
            fi
          done < <(jq -c '.[]' targets.json)
          # a native host builds when it, or the host it cross-builds, needs it
          hosts='[]'
          cross='[]'
          for t in "${targets[@]}"; do
            [ -n "$(jq -r '.cross_from // empty' <<< "${row[$t]}")" ] && continue
            entry=$(jq -c --arg k "${key[$t]}" --arg self "${want[$t]}" '. + {host_key: $k, self: ($self == "true")}' <<< "${row[$t]}")
            need=${want[$t]}
            for c in "${targets[@]}"; do
              [ "$(jq -r '.cross_from // empty' <<< "${row[$c]}")" = "$t" ] || continue
              [ "${want[$c]}" = true ] || continue
              entry=$(jq -c --arg ct "$c" --arg ck "${key[$c]}" '. + {cross_target: $ct, cross_key: $ck}' <<< "$entry")
              cross=$(jq -c --argjson r "${row[$c]}" --arg k "${key[$c]}" '. + [$r + {host_key: $k}]' <<< "$cross")
              need=true
            done
            if [ "$need" = true ]; then
              hosts=$(jq -c --argjson e "$entry" '. + [$e]' <<< "$hosts")
            fi
          done
          echo "hosts=$hosts" >> "$GITHUB_OUTPUT"
          echo "cross=$cross" >> "$GITHUB_OUTPUT"
          [ "$hosts" = '[]' ] && echo "::notice::every host's key is released; nothing to build"
          true

  build:
    name: Build (${{ matrix.target }})
    needs: prepare
    if: needs.prepare.outputs.hosts != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.hosts) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 355
    env:
      ZIG_HOST_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/julia* /usr/lib/jvm /usr/share/miniconda
          df -h /

      # as checked in, so the scripts hash as they did in prepare
      - name: Check out zig-build
        run: |
          git config --global core.autocrlf false
          bash .github/scripts/clone-zig-build.sh "${{ needs.prepare.outputs.zig_build_commit }}"

      - name: Fetch zig-src
        working-directory: zig-build
        run: bash ./ci-sources.sh

      - name: Check the host key
        working-directory: zig-build
        env:
          WANT: ${{ matrix.host_key }}
        run: |
          # the manifest records prepare's key, which decides what is built;
          # a differing key here means the runner sees other inputs
          got=$(bash ./cross-manifest.sh key host)
          [ "$got" = "$WANT" ] || echo "::warning::host key $got on the runner, $WANT in prepare"

      # A host's quirks from targets.json:
      #   args           passed to both zig builds (build-stage3.sh forwards its
      #                  arguments): `--maxrss 8000000000` where the runner has
      #                  less memory than Zig's build declares (macos-15 has 7 GB),
      #                  `-j2` where full parallelism runs it out of memory
      #   no_pkg_config  a PKG_CONFIG that does not exist, so Zig's build skips
      #                  pkg-config (windows-11-arm's Strawberry Perl one is broken)
      #   cross_from     the host whose job cross-builds this one with its own
      #                  stage3, where this host's bootstrap fails; smoke-tested on
      #                  its own runner (smoke job)
      #   skip           the reason a host is not built for now (prepare)
      - name: Build stage3
        working-directory: zig-build
        env:
          ARGS: ${{ matrix.args }}
          NO_PKG_CONFIG: ${{ matrix.no_pkg_config }}
        run: |
          [ "$NO_PKG_CONFIG" = true ] && export PKG_CONFIG=no-pkg-config
          # memory every 30 s on Linux, to tell a runner killed for memory
          # from one lost otherwise; and 16 GB of swap, as macOS has its own:
          # bootstrapping peaks past the 16 GB ubuntu-24.04-arm has
          if [ "$RUNNER_OS" = Linux ]; then
            sudo fallocate -l 16G /swapfile-zig && sudo chmod 600 /swapfile-zig
            sudo mkswap /swapfile-zig >/dev/null && sudo swapon /swapfile-zig
            swapon --show
            (while sleep 30; do echo "mem: $(free -m | awk 'NR==2 {print $3 " MB used, " $7 " MB available"}')"; done) &
          fi
          # ARGS splits into words on purpose
          bash ./build-stage3.sh $ARGS

      - name: Package
        id: package
        env:
          HOST_KEY: ${{ matrix.host_key }}
          ZIG_BUILD_COMMIT: ${{ needs.prepare.outputs.zig_build_commit }}
        run: |
          version=$(zig-build/bin/stage3/bin/zig version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          dir=$(bash .github/scripts/package.sh zig-build/bin/stage3 "$ZIG_HOST_TARGET" "$HOST_KEY" zig2 "$version")
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Smoke test the package
        run: bash .github/scripts/smoke.sh "${{ steps.package.outputs.dir }}"

      - uses: actions/upload-artifact@v7
        if: ${{ matrix.self }}
        with:
          name: zig-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # The host this one cross-builds: this stage3 (the same zig-src) with that
      # host's devkit LLVM, as build-stage3.sh's stage 2 does with zig2; the smoke
      # job tests it on its own runner
      - name: Cross-build stage3 for ${{ matrix.cross_target }}
        if: ${{ matrix.cross_target }}
        working-directory: zig-build
        env:
          CROSS_TARGET: ${{ matrix.cross_target }}
        run: bash ../.github/scripts/build-stage3-cross.sh "$CROSS_TARGET" "$PWD/bin/stage3-$CROSS_TARGET"

      - name: Package ${{ matrix.cross_target }}
        if: ${{ matrix.cross_target }}
        env:
          CROSS_TARGET: ${{ matrix.cross_target }}
          CROSS_KEY: ${{ matrix.cross_key }}
          VERSION: ${{ steps.package.outputs.version }}
          ZIG_BUILD_COMMIT: ${{ needs.prepare.outputs.zig_build_commit }}
        run: |
          rm -rf dist
          bash .github/scripts/package.sh "zig-build/bin/stage3-$CROSS_TARGET" "$CROSS_TARGET" "$CROSS_KEY" "cross from $ZIG_HOST_TARGET" "$VERSION"

      - uses: actions/upload-artifact@v7
        if: ${{ matrix.cross_target }}
        with:
          name: cross-${{ matrix.cross_target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Smoke test (${{ matrix.target }})
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.outputs.cross != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.cross) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: cross-${{ matrix.target }}
          path: dist

      - name: Smoke test the package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          archive=$(jq -r .archive "dist/manifest-$TARGET.json")
          mkdir -p "$RUNNER_TEMP/unpacked"
          case "$archive" in
            *.zip) 7z x -bso0 -o"$RUNNER_TEMP/unpacked" "dist/$archive" ;;
            *) tar -xJf "dist/$archive" -C "$RUNNER_TEMP/unpacked" ;;
          esac
          dir=${archive%.zip}
          bash .github/scripts/smoke.sh "$RUNNER_TEMP/unpacked/${dir%.tar.xz}"

      - uses: actions/upload-artifact@v7
        with:
          name: zig-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build, smoke]
    # what built publishes, even if another host failed
    if: ${{ !cancelled() && needs.prepare.outputs.hosts != '[]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: zig-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          manifests=(dist/manifest-*.json)
          [ ${#manifests[@]} -gt 0 ] || { echo "::error::no host built"; exit 1; }
          versions=$(jq -r .zig_version "${manifests[@]}" | sort -u)
          [ "$(wc -l <<< "$versions")" = 1 ] || { echo "::error::hosts built different versions: $versions"; exit 1; }
          version=$versions
          tag="zig-$version"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # another run built this version for other hosts (or this is a forced rebuild)
            gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber dist/*
          else
            m=${manifests[0]}
            jq -r '"Zig `\(.zig_version)`, built by " +
              "[zig-build `\(.zig_build_commit[0:12])`](https://github.com/randyos-org/zig-build/commit/\(.zig_build_commit)) " +
              "(zig-src `\(.zig_src_commit[0:12])`) on GitHub-hosted runners, one archive per host, each smoke-tested on its own runner.\n\n" +
              "Install it in a workflow with `uses: randyos-org/zig-toolchain/setup@main`. " +
              "Each `manifest-<host>.json` lists that build'"'"'s inputs."' "$m" > notes.md
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "Zig $version" --notes-file notes.md --latest dist/*
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
